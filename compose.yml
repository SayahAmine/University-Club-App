services:
  db:
    image: postgres:16-alpine
    container_name: university-club-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: university_club
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d university_club"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: